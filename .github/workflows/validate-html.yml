name: Validate HTML

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-validation:
    name: Check HTML syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install HTML validator
        run: python -m pip install --upgrade html5validator

      - name: Validate all HTML files
        run: |
          set -o pipefail
          html5validator --root . --show-warnings
